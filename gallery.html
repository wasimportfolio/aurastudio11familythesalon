<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="premium.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Gallery | Aura Studio 11 – Family The Salon</title>
</head>

<body data-page="gallery.html">
    <section class="page-hero" style="--bg:url('images/gallery-hero.jpg')">
        <h1>Our Gallery</h1>
        <p>Recent looks and moments from the studio. Tap a photo to view it larger.</p>
    </section>
    <div class="wrap">
        <div class="filters">
            <button class="on" data-c="all">All</button><button data-c="hair">Hair</button><button
                data-c="bridal">Bridal</button><button data-c="makeup">Makeup</button><button
                data-c="skin">Skin</button><button data-c="nails">Nails</button><button data-c="salon">Studio</button>
        </div>
        <div class="g-grid" id="g-grid">
            <figure data-c="hair"><img src="images/women-haircut.jpg" alt="Salon hair styling" loading="lazy"></figure>
            <figure data-c="hair"><img src="images/client2.webp" alt="Haircut" loading="lazy"></figure>
            <figure data-c="makeup"><img src="images/makeup.jpg" alt="Makeup" loading="lazy"></figure>
            <figure data-c="bridal"><img src="images/bridal.jpg" alt="Bridal styling" loading="lazy"></figure>
            <figure data-c="skin"><img src="images/facial2.jpg" alt="Skin care" loading="lazy"></figure>
            <figure data-c="hair"><img src="images/women-haircut1.jpg" alt="Hair styling" loading="lazy"></figure>
            <figure data-c="hair"><img src="images/hair-spa.jpg" alt="Haircut" loading="lazy"></figure>
            <figure data-c="makeup"><img src="images/mackup.jpg" alt="Makeup service" loading="lazy"></figure>
            <figure data-c="bridal"><img src="images/insta2.jpg" alt="Bridal beauty" loading="lazy"></figure>
            <figure data-c="nails"><img src="images/nail-care.jpg" alt="Nail care" loading="lazy"></figure>
            <figure data-c="nails"><img src="images/insta6.jpg" alt="Nail styling" loading="lazy"></figure>
            <figure data-c="skin"><img src="images/facial.jpg" alt="Facial treatment" loading="lazy"></figure>
            <figure data-c="salon"><img src="images/men-haircut1.jpg" alt="Salon interior" loading="lazy"></figure>
            <figure data-c="salon"><img src="images/men-haircut.jpg" alt="Salon studio" loading="lazy"></figure>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
